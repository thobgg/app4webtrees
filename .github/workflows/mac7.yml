# wtMac7: die macOS-Fassung der Variante fuer webtrees-gedcom7-lab (webtrees7, GEDCOM 7.0), versuchsweise und
# unsigniert wie wtMac. Eigene Bundle-ID (desktop/build.gradle.kts, Variante 7), installiert und laeuft neben wtMac.
# Nur von Hand (Actions > wtMac7 > Run workflow): bauen, die dmg liegt unter "Artifacts" des Laufs; kein Release.
name: wtMac7

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dmg:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest      # Apple Silicon (M1 und neuer)
            arch: arm64
          - runner: macos-15-intel    # aeltere Macs mit Intel-Prozessor
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0              # die dritte Versionsstelle ist die Zahl der Commits
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: dmg bauen
        run: ./gradlew --no-daemon -Pwtand.variante=7 :desktop:packageDmg
      - name: Datei nach Prozessor benennen
        run: |
          mkdir -p out
          for f in desktop/build/compose/binaries/main/dmg/*.dmg; do
            cp "$f" "out/$(basename "${f%.dmg}")-${{ matrix.arch }}.dmg"
          done
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: wtMac7-${{ matrix.arch }}
          path: out/*.dmg
