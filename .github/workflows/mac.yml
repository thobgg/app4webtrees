# wtMac: die Desktop-Fassung fuer macOS, versuchsweise und unsigniert (27.09.2026).
# Ein Mac-Paket laesst sich nur auf einem Mac bauen - darum hier auf GitHub statt am eigenen Rechner.
# Von Hand (Actions > wtMac > Run workflow): nur bauen, die dmg liegt dann unter "Artifacts" des Laufs.
# Bei einem veroeffentlichten Release: bauen und die dmg-Dateien an das Release haengen.
name: wtMac

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  dmg:
    # Releases mit Tag gedaudit-* gehoeren gedaudit.yml, nicht hierher (13.10.2026)
    if: github.event_name != 'release' || !startsWith(github.event.release.tag_name, 'gedaudit-')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest      # Apple Silicon (M1 und neuer)
            arch: arm64
          - runner: macos-15-intel    # aeltere Macs mit Intel-Prozessor
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0              # die dritte Versionsstelle ist die Zahl der Commits
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: dmg bauen
        run: ./gradlew --no-daemon :desktop:packageDmg
      - name: Datei nach Prozessor benennen
        run: |
          mkdir -p out
          for f in desktop/build/compose/binaries/main/dmg/*.dmg; do
            cp "$f" "out/$(basename "${f%.dmg}")-${{ matrix.arch }}.dmg"
          done
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: wtMac-${{ matrix.arch }}
          path: out/*.dmg
      - name: An das Release haengen
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" out/*.dmg --clobber
