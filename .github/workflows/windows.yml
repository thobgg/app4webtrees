# wtWin7: Windows-Installer der Variante fuer webtrees7 (desktop/installer/wtWin7.iss), nur in diesem privaten Repo.
# Von Hand (Actions > wtWin7 > Run workflow): bauen, die exe liegt unter "Artifacts" des Laufs.
# Bei einem veroeffentlichten Release: bauen und die exe an das Release haengen.
# Die privaten Pakete (webtrees7, api4webtrees 2.x) kommen aus dem Release "lokal-pakete" dieses Repos, in den Namen,
# die gradle.properties erwartet (webtrees-<lokal.webtrees>.zip, api4webtrees-v<lokal.api4webtrees>.zip).
name: wtWin7

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  exe:
    if: github.event_name != 'release' || github.event.release.tag_name != 'lokal-pakete'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0              # die dritte Versionsstelle ist die Zahl der Commits
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Inno Setup pruefen
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          Get-Item "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" | Select-Object FullName, Length
      - name: Private Pakete holen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p desktop/build/lokal-cache
          gh release download lokal-pakete -p '*.zip' -D desktop/build/lokal-cache --clobber
          ls -l desktop/build/lokal-cache
      - name: Installer bauen
        run: ./gradlew --no-daemon :desktop:packageInno
      - uses: actions/upload-artifact@v4
        with:
          name: wtWin7
          path: desktop/build/compose/binaries/main/inno/*.exe
      - name: An das Release haengen
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" desktop/build/compose/binaries/main/inno/*.exe --clobber
