# PHP fuer "Neuen Stammbaum auf diesem PC anlegen" (Stufe 4, 27.09.2026).
# wtWin/wtTux bringen ein eigenes, statisches PHP mit, das webtrees mit SQLite ausfuehrt (php -S, nur 127.0.0.1).
# Die fertigen Pakete von static-php.dev passen nicht (mal fehlt intl, mal pdo_sqlite) - darum selbst bauen.
# Nur von Hand (Actions > PHP > Run workflow); das Ergebnis haengt am Vor-Release "php-8.4", von dort holt es der
# Paketbau (desktop/build.gradle.kts). Nicht bei jedem Release neu bauen: PHP aendert sich selten.
name: PHP

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  PHP_VERSION: "8.4"
  SPC_VERSION: "2.8.5"
  # webtrees 2.2 (composer.json): Pflicht ctype curl gd iconv intl json mbstring pcre pdo session xml,
  # dazu pdo_sqlite (Datenbank), zip (Upgrade-Assistent), zlib; dom/simplexml/xmlreader/xmlwriter fuer GEDCOM-Import
  # und Pakete, openssl fuer https (Update-Pruefung), fileinfo/filter fuer Medien und Formulare.
  # pdo_mysql auch bei SQLite: der Einrichtungsassistent liest pdo_mysql.default_socket und bricht sonst ab.
  PHP_EXT: "ctype,curl,dom,fileinfo,filter,gd,iconv,intl,mbstring,mysqlnd,openssl,pdo,pdo_mysql,pdo_sqlite,session,simplexml,sqlite3,tokenizer,xml,xmlreader,xmlwriter,zip,zlib"
  PHP_LIBS: "libjpeg,libpng,libwebp,freetype"
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: static-php-cli holen
        run: |
          curl -fsSL -o spc.tgz "https://github.com/crazywhalecc/static-php-cli/releases/download/${SPC_VERSION}/spc-linux-x86_64.tar.gz"
          tar xzf spc.tgz && chmod +x spc
      - name: Werkzeuge pruefen
        run: ./spc doctor --auto-fix
      - name: Quellen laden
        run: ./spc download --with-php="$PHP_VERSION" --for-extensions="$PHP_EXT" --for-libs="$PHP_LIBS" --prefer-pre-built
      - name: PHP bauen
        run: ./spc build "$PHP_EXT" --with-libs="$PHP_LIBS" --build-cli
      - name: Pruefen und packen
        run: |
          mkdir -p out/php
          cp buildroot/bin/php out/php/php
          strip out/php/php || true
          out/php/php -v
          out/php/php -m
          for e in intl pdo_sqlite pdo_mysql gd zip curl mbstring; do out/php/php -m | grep -qx "$e" || { echo "FEHLT: $e"; exit 1; }; done
          out/php/php -r "var_dump(function_exists('imagejpeg'), function_exists('imagepng'), function_exists('imagewebp'));"
          tar czf php-linux-x64.tar.gz -C out php
          ls -la php-linux-x64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: php-linux-x64
          path: php-linux-x64.tar.gz

  windows:
    # static-php-cli 2.8 erkennt nur Visual Studio 2019/2022 - windows-latest bringt ein neueres mit.
    runs-on: windows-2022
    steps:
      - name: static-php-cli holen
        shell: pwsh
        run: Invoke-WebRequest -Uri "https://github.com/crazywhalecc/static-php-cli/releases/download/$env:SPC_VERSION/spc-windows-x64.exe" -OutFile spc.exe
      - name: Werkzeuge pruefen
        shell: pwsh
        run: .\spc.exe doctor --auto-fix
      - name: Quellen laden
        shell: pwsh
        run: .\spc.exe download --with-php="$env:PHP_VERSION" --for-extensions="$env:PHP_EXT" --for-libs="$env:PHP_LIBS" --prefer-pre-built
      - name: PHP bauen
        shell: pwsh
        run: .\spc.exe build "$env:PHP_EXT" --with-libs="$env:PHP_LIBS" --build-cli
      - name: Pruefen und packen
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out\php | Out-Null
          Copy-Item buildroot\bin\php.exe out\php\php.exe
          out\php\php.exe -v
          $mods = out\php\php.exe -m
          $mods
          foreach ($e in 'intl','pdo_sqlite','pdo_mysql','gd','zip','curl','mbstring') { if (-not ($mods -contains $e)) { Write-Error "FEHLT: $e"; exit 1 } }
          out\php\php.exe -r "var_dump(function_exists('imagejpeg'), function_exists('imagepng'), function_exists('imagewebp'));"
          Compress-Archive -Path out\php -DestinationPath php-windows-x64.zip
          Get-Item php-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: php-windows-x64
          path: php-windows-x64.zip

  release:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: An das Vor-Release php-8.4 haengen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum php-*.tar.gz php-*.zip > php-sha256.txt
          cat php-sha256.txt
          gh release view php-8.4 -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create php-8.4 -R "$GITHUB_REPOSITORY" --prerelease --latest=false \
              --title "PHP 8.4 fuer wtWin/wtTux (nur Baustein)" \
              --notes "Statisches PHP fuer 'Neuen Stammbaum auf diesem PC anlegen'. Kein Programm zum Herunterladen - steckt im Installer."
          gh release upload php-8.4 -R "$GITHUB_REPOSITORY" php-*.tar.gz php-*.zip php-sha256.txt --clobber
