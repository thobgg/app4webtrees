org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# EINE Versionsnummer fuer den gemeinsamen Code (Android und Desktop sind eine
# Codebasis), ZWEI Build-Zaehler fuer die Pakete - Muster wie mpd-app (23.09.2026).
# versionCode +1 bei jedem Android-Build (Obtainium), desktopBuild +1 je Desktop-Paket.
wtand.versionName=1.55.1
wtand.versionCode=63
wtand.desktopBuild=3
# Paketvariante wtTux7/wtWin7 fuer webtrees7 (nur auf diesem lokalen Branch, nie veroeffentlichen):
# die lokal.*-Pakete liegen in privaten Releases und muessen vorher in desktop/build/lokal-cache stehen.
wtand.variante=7
# "Neuen Stammbaum auf diesem PC anlegen": steckt im Installer (mitliefern statt beim Anlegen herunterladen). webtrees/api4webtrees wie nas4webtrees VERSIONS; PHP aus dem Vor-Release php-8.4
# (.github/workflows/php.yml) - nach jedem neuen PHP-Build die Pruefsummen aus php-sha256.txt hier eintragen.
lokal.webtrees=2.3.0-webtrees7.1
lokal.webtreesSha256=d9e6d0b9b9a37b47390c5e127fdb821437697b765ce396c9ba3051cbc61ef042
lokal.api4webtrees=2.0.1
lokal.api4webtreesSha256=5d346fdc28c53e2aefec64d2ae1fe0ddfe0e6acd89786927506ede5a4cf91284
# Modul Sammlungen (Archiv): mitgeliefert, damit der Stammbaum auf diesem PC das Archiv gleich hat
# Sammlungen 1.x laeuft nicht auf webtrees7 (Routing von webtrees 2.3) - vorerst ohne
lokal.sammlungen=
lokal.sammlungenSha256=
lokal.phpSha256.linux-x64=5775af65b310c075856dd97bfe3de6a62fb7a53075ea577321b11c2bc261724a
